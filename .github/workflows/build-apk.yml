name: Build GHOSI Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ghosi/musicplayer
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GHOSIMusicPlayer'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ghosi.musicplayer'
            compileSdk 34
            defaultConfig {
              applicationId 'com.ghosi.musicplayer'
              minSdk 24
              targetSdk 28
              versionCode 1
              versionName '0.1'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="GHOSI Music Player" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/ghosi/musicplayer/MainActivity.java <<'EOF'
          package com.ghosi.musicplayer;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            private WebView web;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_REQUEST = 42;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              setContentView(web);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setMediaPlaybackRequiresUserGesture(false);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;
                  try { startActivityForResult(params.createIntent(), FILE_REQUEST); return true; }
                  catch (Exception e) { fileCallback = null; return false; }
                }
              });
              web.loadUrl("https://ghosi.floot.app");
            }
            @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode == FILE_REQUEST && fileCallback != null) {
                fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                fileCallback = null;
              }
            }
            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
            @Override protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          EOF
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GHOSI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
